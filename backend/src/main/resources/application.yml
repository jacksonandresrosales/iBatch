server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  max-http-request-header-size: 16KB

spring:
  application:
    name: ibatch-backend
  servlet:
    multipart:
      max-file-size: ${MAX_MULTIPART_FILE_SIZE:50MB}
      max-request-size: ${MAX_MULTIPART_REQUEST_SIZE:51MB}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ibatch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: 5000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  files:
    input-dir: ${APP_FILES_INPUT_DIR:input}
    max-size-bytes: ${MAX_FILE_SIZE_BYTES:52428800}
  processing:
    batch-size: ${PROCESSING_BATCH_SIZE:500}
    max-records: ${MAX_FILE_RECORDS:1000000}
  security:
    bootstrap-admin:
      username: ${IBATCH_ADMIN_USERNAME:admin}
      password: ${IBATCH_ADMIN_PASSWORD:}
    bootstrap-operator:
      username: ${IBATCH_OPERATOR_USERNAME:operator}
      password: ${IBATCH_OPERATOR_PASSWORD:}
